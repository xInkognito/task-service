services:
  liquibase:
    build: ./task-db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: "${DB_URL}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SCHEMA: "${DB_SCHEMA}"
    command: >
      bash -c "liquibase --url=${DB_URL} 
      --username=${DB_USER} --password=${DB_PASSWORD} 
      --changelog-file=db/database-changelog.xml 
      execute-sql --sql='CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA};' && 
      liquibase --url=${DB_URL} 
      --username=${DB_USER} --password=${DB_PASSWORD} 
      --changelog-file=db/database-changelog.xml 
      --default-schema-name=${DB_SCHEMA} 
      update"

  app:
    build: ./task-impl
    ports:
      - "9001:8070"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: "${DB_URL}?currentSchema=${DB_SCHEMA}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: "${DB_SCHEMA}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS}"
      SPRING_LIQUIBASE_ENABLED: "false"
      JWT_SECRET: "${JWT_SECRET}"
      TECH_TOKEN: "${TECH_TOKEN}"
      USER_SERVICE_URL: "${USER_SERVICE_URL}"
    depends_on:
      liquibase:
        condition: service_completed_successfully